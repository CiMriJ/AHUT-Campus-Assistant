plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ahut.campusassistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.ahut.campusassistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            // 只打包真机常用的 64 位 ARM，减小安装包体积
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        buildPython("D:/py/python.exe")
        pip {
            install("flask==3.0.3")
            install("requests==2.32.3")
            install("beautifulsoup4==4.12.3")
            install("lxml==5.3.0")
            install("pycryptodome==3.21.0")
            install("cryptography==42.0.8")
        }
    }
}
